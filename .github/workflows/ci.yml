# Build jaunt's indirect display driver for x64 and ARM64 on every push and pull request, test its
# control protocol, check the install scripts (tests/scripts_test.ps1), make the catalog again as a
# release does after signing (catalog.ps1), and, on x64, install the unsigned package as a person
# does and use it: a monitor must become an active display (tests/load_test.ps1; GitHub's runner
# boots in test-signing mode). A failing step fails the job.
# SPDX-License-Identifier: MIT
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build, and test the control protocol
        shell: pwsh
        run: |
          $r = ./build.ps1 -Platform $env:PLATFORM -Version 0.0.1 -Out out | Select-Object -Last 1
          $r
          $j = $r | ConvertFrom-Json
          if ($j.protocolTests -ne "passed" -or -not ($j.driver -like "built*")) { exit 1 }
          if ($j.versionInfo.productName -ne "jaunt indirect display driver" -or $j.versionInfo.productVersion -ne "0.0.1") {
            "::error::The DLL's version information: $($j.versionInfo | ConvertTo-Json -Compress)"
            exit 1
          }
      - name: The install scripts
        if: matrix.platform == 'x64'
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -InputFormat None -ExecutionPolicy Bypass -File tests/scripts_test.ps1 -Package out/x64/package
      - name: The catalog, made again as a release does after signing
        shell: pwsh
        run: |
          Copy-Item -Recurse "out/$env:PLATFORM/package/driver" catalog-check
          ./catalog.ps1 -Driver catalog-check -Platform $env:PLATFORM
      # Blocking: GitHub's runner boots in test-signing mode, so the package, installed as an unsigned
      # release is (install.ps1 -SignLocally, a certificate made in this job and removed after), can
      # be installed, used (a monitor added that must become an active display of its size, then
      # removed with the topology back; the watchdog) and uninstalled (tests/load_test.ps1). The
      # driver's own log and the steps' details are in the job's artifact (out/load-driver.log,
      # out/load-test.log).
      - name: The driver loaded and used, a monitor made an active display
        if: matrix.platform == 'x64'
        timeout-minutes: 20
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -InputFormat None -ExecutionPolicy Bypass -File tests/load_test.ps1 -Package out/x64/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: package-${{ matrix.platform }}-unsigned
          path: |
            out/${{ matrix.platform }}/package
            out/*.log
